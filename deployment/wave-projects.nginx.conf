server {
    listen 80;
    listen [::]:80;
    server_name wave-projects.com www.wave-projects.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://wave-projects.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wave-projects.com www.wave-projects.com;
    ssl_certificate /etc/letsencrypt/live/wave-projects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wave-projects.com/privkey.pem;

    root /var/www/muz-landing;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
