# Публикует только вебхук Яндекс.Диалогов. Пульт и API моста остаются
# локальными; при необходимости откройте их через VPN или отдельный location.
#
# 1. Замените muz.example.com на свой домен.
# 2. Получите сертификат: certbot --nginx -d muz.example.com
# 3. В .env задайте:
#    WEB_PUBLIC_URL=https://muz.example.com
#    WEB_SECURE=1
#    WEB_TRUST_PROXY=1
#    ALICE_WEBHOOK_SECRET=<длинная случайная строка без />
# 4. В Яндекс.Диалогах укажите:
#    https://muz.example.com/alice/webhook/<ALICE_WEBHOOK_SECRET>

server {
    listen 80;
    listen [::]:80;
    server_name muz.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name muz.example.com;

    ssl_certificate     /etc/letsencrypt/live/muz.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muz.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Секретный суффикс делает путь непредсказуемым; ALICE_SKILL_ID
    # дополнительно проверяет, что запрос пришёл от нужного навыка.
    location ^~ /alice/webhook/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        client_max_body_size 128k;
    }

    # Вариант без секрета: раскомментируйте и задайте точный путь.
    # location = /alice/webhook {
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     client_max_body_size 128k;
    # }

    # Пульт по локальной сети/VPN (не публикуйте в интернет без пароля).
    # location / {
    #     allow 192.168.1.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / { return 404; }
}
